apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: ecommerce}
spec:
  replicas: 2
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
      - name: api-gateway
        image: YOUR_ECR_REGISTRY/ecommerce-api-gateway:latest
        ports: [{containerPort: 8000}]
        env:
        - name: SERVICE_NAME
          value: api-gateway
        - name: PORT
          value: "8000"
        readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 20}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
