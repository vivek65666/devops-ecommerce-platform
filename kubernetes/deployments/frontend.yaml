apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: ecommerce}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: YOUR_ECR_REGISTRY/ecommerce-frontend:latest
        ports: [{containerPort: 80}]
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5}
