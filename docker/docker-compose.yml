services:
  frontend:
    build: ../frontend
    ports: ["3000:80"]
    depends_on: [api-gateway]
  api-gateway:
    build: ../services/api-gateway
    ports: ["8000:8000"]
    environment:
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
      CART_SERVICE_URL: http://cart-service:8003
      ORDER_SERVICE_URL: http://order-service:8004
      PAYMENT_SERVICE_URL: http://payment-service:8005
      NOTIFICATION_SERVICE_URL: http://notification-service:8006
    depends_on: [user-service,product-service,cart-service,order-service,payment-service,notification-service]
  user-service: {build: ../services/user-service,environment: {SERVICE_NAME: user-service, PORT: "8001"}}
  product-service: {build: ../services/product-service,environment: {SERVICE_NAME: product-service, PORT: "8002"}}
  cart-service: {build: ../services/cart-service,environment: {SERVICE_NAME: cart-service, PORT: "8003"}}
  order-service: {build: ../services/order-service,environment: {SERVICE_NAME: order-service, PORT: "8004"}}
  payment-service: {build: ../services/payment-service,environment: {SERVICE_NAME: payment-service, PORT: "8005"}}
  notification-service: {build: ../services/notification-service,environment: {SERVICE_NAME: notification-service, PORT: "8006"}}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: ecommerce,POSTGRES_USER: ecommerce,POSTGRES_PASSWORD: ecommerce-dev-only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: {postgres_data: {}}
