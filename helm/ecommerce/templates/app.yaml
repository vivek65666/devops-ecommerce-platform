apiVersion: v1
kind: Namespace
metadata: {name: {{ .Values.namespace }}}
---
{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .name }}, namespace: {{ $.Values.namespace }}}
spec:
  replicas: {{ $.Values.replicas }}
  selector: {matchLabels: {app: {{ .name }}}}
  template:
    metadata: {labels: {app: {{ .name }}}}
    spec:
      containers:
      - name: {{ .name }}
        image: "{{ $.Values.imageRegistry }}/{{ .image }}:latest"
        ports: [{containerPort: {{ .port }}}]
        env:
        - {name: SERVICE_NAME, value: {{ .name }}}
        - {name: PORT, value: "{{ .port }}"}
        readinessProbe: {httpGet: {path: /ready, port: {{ .port }}}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: {{ .port }}}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .name }}, namespace: {{ $.Values.namespace }}}
spec:
  selector: {app: {{ .name }}}
  ports: [{port: {{ .port }}, targetPort: {{ .port }}}]
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: {{ .Values.namespace }}}
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
      - name: api-gateway
        image: "{{ .Values.imageRegistry }}/ecommerce-api-gateway:latest"
        ports: [{containerPort: 8000}]
        env:
        - {name: SERVICE_NAME, value: api-gateway}
        - {name: PORT, value: "8000"}
        - {name: USER_SERVICE_URL, value: http://user-service:8001}
        - {name: PRODUCT_SERVICE_URL, value: http://product-service:8002}
        - {name: CART_SERVICE_URL, value: http://cart-service:8003}
        - {name: ORDER_SERVICE_URL, value: http://order-service:8004}
        - {name: PAYMENT_SERVICE_URL, value: http://payment-service:8005}
        - {name: NOTIFICATION_SERVICE_URL, value: http://notification-service:8006}
        readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: {{ .Values.namespace }}}
spec:
  selector: {app: api-gateway}
  ports: [{port: 8000, targetPort: 8000}]
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: ecommerce, namespace: {{ .Values.namespace }}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: api-gateway, port: {number: 8000}}}}
{{- end }}
