services:
  prometheus: {image: prom/prometheus:v3.1.0, ports: ["9090:9090"], volumes: [./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]}
  loki: {image: grafana/loki:3.3.2, command: -config.file=/etc/loki/loki-config.yml, ports: ["3100:3100"], volumes: [./loki/loki-config.yml:/etc/loki/loki-config.yml:ro]}
  grafana: {image: grafana/grafana:11.4.0, ports: ["3001:3000"], volumes: [./grafana/provisioning:/etc/grafana/provisioning:ro]}
